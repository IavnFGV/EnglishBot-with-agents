name: Deploy service to VPS

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Weekly rebuild + redeploy of main: `docker compose build --pull` picks up
  # security fixes in the base image (Debian packages, Python) even when
  # nothing in this repo changed.
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.3,<27"
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --progress-spinner off

  # Dependabot PRs (incl. security updates): merge patch/minor updates once
  # tests and pip-audit pass, then deploy. Major updates stay for manual review.
  dependabot-automerge:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # requirements.txt uses ranges (aiogram>=3,<4). fetch-metadata misreads a
      # floor bump like ">=1,<2" -> ">=1.2.4,<2" as major. Treat a PR as safe when
      # it only touches requirements.txt and keeps every upper bound unchanged.
      - name: Detect floor-only requirement bumps
        id: floor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          files="$(gh pr diff "$PR_URL" --name-only)"
          diff="$(gh pr diff "$PR_URL")"
          old="$(printf '%s\n' "$diff" | grep -E '^-[^-]' | grep -oE '<[0-9][0-9.]*' | sort || true)"
          new="$(printf '%s\n' "$diff" | grep -E '^\+[^+]' | grep -oE '<[0-9][0-9.]*' | sort || true)"
          if [ "$files" = "requirements.txt" ] && [ -n "$old" ] && [ "$old" = "$new" ]; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge and deploy
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.floor.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --squash --delete-branch "$PR_URL"
          # A merge made with GITHUB_TOKEN does not trigger push workflows,
          # so start the deploy explicitly.
          gh workflow run "${{ github.workflow }}" --ref main --repo "$GITHUB_REPOSITORY"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: deploy-englishbot-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Require trusted SSH host fingerprint
        env:
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: test -n "$VPS_HOST_FINGERPRINT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA
          command_timeout: 15m
          script: |
            set -euo pipefail

            SERVICE_NAME="englishbot"
            STACKS_DIR="/opt/dockge/stacks"
            SERVICE_DIR="${STACKS_DIR}/${SERVICE_NAME}"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            REGISTER_HELPER="/usr/local/bin/infra-vps-register"
            DATA_ROOT="/srv/services/${SERVICE_NAME}"
            BUILD_ENV_PATH="${DATA_ROOT}/build.env"
            STATIC_ROOT="/srv/service-static/${SERVICE_NAME}"
            SYNC_ROOT="/srv/drive-sync/services/${SERVICE_NAME}"

            log_dir_state() {
              local path="$1"
              if sudo test -d "${path}"; then
                echo "[deploy] directory already exists: ${path}"
              else
                echo "[deploy] directory will be created: ${path}"
              fi
            }

            show_dir_state() {
              local path="$1"
              echo "[deploy] ls -ld ${path}"
              sudo ls -ld "${path}"
            }

            echo "[deploy] service=${SERVICE_NAME}"
            echo "[deploy] stacks_dir=${STACKS_DIR}"
            echo "[deploy] service_dir=${SERVICE_DIR}"
            sudo mkdir -p "${STACKS_DIR}"
            log_dir_state "${SERVICE_DIR}"
            sudo mkdir -p "${SERVICE_DIR}"
            sudo chown -R "${USER}:${USER}" "${SERVICE_DIR}"
            show_dir_state "${STACKS_DIR}"
            show_dir_state "${SERVICE_DIR}"

            if [ ! -d "${SERVICE_DIR}/.git" ]; then
              echo "[deploy] cloning repository into ${SERVICE_DIR}"
              git clone --branch main --single-branch "${REPO_URL}" "${SERVICE_DIR}"
            else
              echo "[deploy] repository already present in ${SERVICE_DIR}"
            fi

            cd "${SERVICE_DIR}"
            echo "[deploy] current revision before fetch: $(git rev-parse --short HEAD 2>/dev/null || echo missing)"

            test "$(git branch --show-current)" = main
            git fetch --no-tags origin "${DEPLOY_SHA}"
            git merge --ff-only "${DEPLOY_SHA}"
            test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"
            echo "[deploy] current revision after fast-forward: $(git rev-parse --short HEAD)"

            if [ ! -f .env ]; then
              echo "ERROR: .env is missing in ${SERVICE_DIR}. Create it manually on the VPS before deploy."
              exit 1
            fi
            echo "[deploy] found ${SERVICE_DIR}/.env"

            log_dir_state "${DATA_ROOT}"
            log_dir_state "${DATA_ROOT}/data"
            log_dir_state "${DATA_ROOT}/logs"
            log_dir_state "${DATA_ROOT}/backups"
            log_dir_state "${STATIC_ROOT}"
            log_dir_state "${SYNC_ROOT}"
            log_dir_state "${SYNC_ROOT}/backups"
            sudo mkdir -p "${DATA_ROOT}/data"
            sudo mkdir -p "${DATA_ROOT}/logs"
            sudo mkdir -p "${DATA_ROOT}/backups"
            sudo mkdir -p "${STATIC_ROOT}"
            sudo mkdir -p "${SYNC_ROOT}/backups"
            sudo chown -R "${USER}:${USER}" "${DATA_ROOT}" || true
            sudo chown -R "${USER}:${USER}" "${STATIC_ROOT}" || true
            sudo chown -R "${USER}:${USER}" "${SYNC_ROOT}" || true
            sudo chown -R "${USER}:${USER}" "${SERVICE_DIR}" || true
            show_dir_state "${DATA_ROOT}"
            show_dir_state "${DATA_ROOT}/data"
            show_dir_state "${DATA_ROOT}/logs"
            show_dir_state "${DATA_ROOT}/backups"
            show_dir_state "${STATIC_ROOT}"
            show_dir_state "${SYNC_ROOT}"
            show_dir_state "${SYNC_ROOT}/backups"

            echo "[deploy] syncing placeholder assets into host runtime storage"
            PLACEHOLDER_SOURCE="${SERVICE_DIR}/assets/images/no-image.png"
            if [ ! -f "${PLACEHOLDER_SOURCE}" ]; then
              echo "ERROR: placeholder asset is missing from the checked-out repo: ${PLACEHOLDER_SOURCE}"
              ls -la "${SERVICE_DIR}/assets" || true
              ls -la "${SERVICE_DIR}/assets/images" || true
              exit 1
            fi
            sudo mkdir -p "${STATIC_ROOT}/images"
            sudo cp "${PLACEHOLDER_SOURCE}" "${STATIC_ROOT}/images/no-image.png"
            sudo chmod 644 "${STATIC_ROOT}/images/no-image.png"
            sudo chown "${USER}:${USER}" "${STATIC_ROOT}/images/no-image.png" || true
            ls -l "${STATIC_ROOT}/images/no-image.png"

            export ENGLISHBOT_VERSION="main-${{ github.run_number }}"
            export ENGLISHBOT_GIT_COMMIT="${{ github.sha }}"
            export ENGLISHBOT_BUILD_TIME_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            export ENGLISHBOT_BUILD_REF="${{ github.ref }}"
            export ENGLISHBOT_ENV_NAME="production"

            echo "[deploy] writing persistent build metadata to ${BUILD_ENV_PATH}"
            BUILD_ENV_TMP="${BUILD_ENV_PATH}.tmp.$$"
            printf '%s\n' \
              "ENGLISHBOT_VERSION=${ENGLISHBOT_VERSION}" \
              "ENGLISHBOT_GIT_COMMIT=${ENGLISHBOT_GIT_COMMIT}" \
              "ENGLISHBOT_BUILD_TIME_UTC=${ENGLISHBOT_BUILD_TIME_UTC}" \
              "ENGLISHBOT_BUILD_REF=${ENGLISHBOT_BUILD_REF}" \
              "ENGLISHBOT_ENV_NAME=${ENGLISHBOT_ENV_NAME}" \
              > "${BUILD_ENV_TMP}"
            chmod 644 "${BUILD_ENV_TMP}"
            mv "${BUILD_ENV_TMP}" "${BUILD_ENV_PATH}"
            ls -l "${BUILD_ENV_PATH}"

            if docker network inspect edge >/dev/null 2>&1; then
              echo "[deploy] docker network already exists: edge"
            else
              echo "[deploy] creating docker network: edge"
              docker network create edge
            fi

            echo "[deploy] building with a fresh base image and waiting for health"
            docker compose build --pull
            docker compose up -d --no-build --wait --wait-timeout 120
            echo "[deploy] docker compose ps"
            docker compose ps

            if [ ! -x "${REGISTER_HELPER}" ]; then
              echo "ERROR: ${REGISTER_HELPER} is missing or not executable on the VPS."
              exit 1
            fi

            if [ ! -f "${SERVICE_DIR}/infra/service.env" ]; then
              echo "ERROR: service registration card is missing: ${SERVICE_DIR}/infra/service.env"
              exit 1
            fi

            echo "[deploy] service registration card: ${SERVICE_DIR}/infra/service.env"
            ls -la "${SERVICE_DIR}/infra"
            echo "[deploy] registering service with ${REGISTER_HELPER}"
            sudo "${REGISTER_HELPER}" \
              --card "${SERVICE_DIR}/infra/service.env" \
              --service-dir "${SERVICE_DIR}"
