name: Deploy service to VPS

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            SERVICE_NAME="englishbot"
            STACKS_DIR="/opt/dockge/stacks"
            SERVICE_DIR="${STACKS_DIR}/${SERVICE_NAME}"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            REGISTER_HELPER="/usr/local/bin/infra-vps-register-service-scheduled-tasks"
            DATA_ROOT="/srv/services/${SERVICE_NAME}"
            SYNC_ROOT="/srv/drive-sync/services/${SERVICE_NAME}"

            log_dir_state() {
              local path="$1"
              if sudo test -d "${path}"; then
                echo "[deploy] directory already exists: ${path}"
              else
                echo "[deploy] directory will be created: ${path}"
              fi
            }

            show_dir_state() {
              local path="$1"
              echo "[deploy] ls -ld ${path}"
              sudo ls -ld "${path}"
            }

            echo "[deploy] service=${SERVICE_NAME}"
            echo "[deploy] stacks_dir=${STACKS_DIR}"
            echo "[deploy] service_dir=${SERVICE_DIR}"
            sudo mkdir -p "${STACKS_DIR}"
            log_dir_state "${SERVICE_DIR}"
            sudo mkdir -p "${SERVICE_DIR}"
            sudo chown -R "${USER}:${USER}" "${SERVICE_DIR}"
            show_dir_state "${STACKS_DIR}"
            show_dir_state "${SERVICE_DIR}"

            if [ ! -d "${SERVICE_DIR}/.git" ]; then
              echo "[deploy] cloning repository into ${SERVICE_DIR}"
              rm -rf "${SERVICE_DIR}"
              git clone "${REPO_URL}" "${SERVICE_DIR}"
            else
              echo "[deploy] repository already present in ${SERVICE_DIR}"
            fi

            cd "${SERVICE_DIR}"
            echo "[deploy] current revision before fetch: $(git rev-parse --short HEAD 2>/dev/null || echo missing)"

            git fetch --all --prune
            git reset --hard origin/main
            echo "[deploy] current revision after reset: $(git rev-parse --short HEAD)"

            if [ ! -f .env ]; then
              echo "ERROR: .env is missing in ${SERVICE_DIR}. Create it manually on the VPS before deploy."
              exit 1
            fi
            echo "[deploy] found ${SERVICE_DIR}/.env"

            log_dir_state "${DATA_ROOT}"
            log_dir_state "${DATA_ROOT}/data"
            log_dir_state "${DATA_ROOT}/logs"
            log_dir_state "${DATA_ROOT}/backups"
            log_dir_state "${DATA_ROOT}/assets"
            log_dir_state "${SYNC_ROOT}"
            log_dir_state "${SYNC_ROOT}/backups"
            sudo mkdir -p "${DATA_ROOT}/data"
            sudo mkdir -p "${DATA_ROOT}/logs"
            sudo mkdir -p "${DATA_ROOT}/backups"
            sudo mkdir -p "${DATA_ROOT}/assets"
            sudo mkdir -p "${SYNC_ROOT}/backups"
            sudo chown -R "${USER}:${USER}" "${DATA_ROOT}" || true
            sudo chown -R "${USER}:${USER}" "${SYNC_ROOT}" || true
            sudo chown -R "${USER}:${USER}" "${SERVICE_DIR}" || true
            show_dir_state "${DATA_ROOT}"
            show_dir_state "${DATA_ROOT}/data"
            show_dir_state "${DATA_ROOT}/logs"
            show_dir_state "${DATA_ROOT}/backups"
            show_dir_state "${DATA_ROOT}/assets"
            show_dir_state "${SYNC_ROOT}"
            show_dir_state "${SYNC_ROOT}/backups"

            echo "[deploy] syncing placeholder assets into host runtime storage"
            PLACEHOLDER_SOURCE="${SERVICE_DIR}/assets/images/no-image.png"
            if [ ! -f "${PLACEHOLDER_SOURCE}" ]; then
              echo "ERROR: placeholder asset is missing from the checked-out repo: ${PLACEHOLDER_SOURCE}"
              ls -la "${SERVICE_DIR}/assets" || true
              ls -la "${SERVICE_DIR}/assets/images" || true
              exit 1
            fi
            sudo mkdir -p "${DATA_ROOT}/assets/images"
            sudo cp "${PLACEHOLDER_SOURCE}" "${DATA_ROOT}/assets/images/no-image.png"
            sudo chmod 644 "${DATA_ROOT}/assets/images/no-image.png"
            sudo chown "${USER}:${USER}" "${DATA_ROOT}/assets/images/no-image.png" || true
            ls -l "${DATA_ROOT}/assets/images/no-image.png"

            export ENGLISHBOT_VERSION="main-${{ github.run_number }}"
            export ENGLISHBOT_GIT_COMMIT="${{ github.sha }}"
            export ENGLISHBOT_BUILD_TIME_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            export ENGLISHBOT_BUILD_REF="${{ github.ref }}"
            export ENGLISHBOT_ENV_NAME="production"

            if docker network inspect edge >/dev/null 2>&1; then
              echo "[deploy] docker network already exists: edge"
            else
              echo "[deploy] creating docker network: edge"
              docker network create edge
            fi

            echo "[deploy] running docker compose up -d --build"
            docker compose up -d --build
            echo "[deploy] docker compose ps"
            docker compose ps

            if [ ! -x "${REGISTER_HELPER}" ]; then
              echo "ERROR: ${REGISTER_HELPER} is missing or not executable on the VPS."
              exit 1
            fi

            if [ ! -d "${SERVICE_DIR}/scheduled-tasks" ]; then
              echo "ERROR: service-owned scheduled tasks directory is missing: ${SERVICE_DIR}/scheduled-tasks"
              exit 1
            fi

            echo "[deploy] service-owned scheduled tasks directory: ${SERVICE_DIR}/scheduled-tasks"
            ls -la "${SERVICE_DIR}/scheduled-tasks"
            echo "[deploy] registering service-owned scheduled tasks with ${REGISTER_HELPER}"
            sudo SERVICE_NAME="${SERVICE_NAME}" SERVICE_DIR="${SERVICE_DIR}" "${REGISTER_HELPER}"
