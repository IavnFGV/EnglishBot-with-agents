name: englishbot

services:
  app:
    build:
      context: .
      args:
        ENGLISHBOT_VERSION: ${ENGLISHBOT_VERSION:-dev}
        ENGLISHBOT_GIT_COMMIT: ${ENGLISHBOT_GIT_COMMIT:-unknown}
        ENGLISHBOT_BUILD_TIME_UTC: ${ENGLISHBOT_BUILD_TIME_UTC:-unknown}
        ENGLISHBOT_BUILD_REF: ${ENGLISHBOT_BUILD_REF:-unknown}
        ENGLISHBOT_ENV_NAME: ${ENGLISHBOT_ENV_NAME:-production}
    restart: unless-stopped
    labels:
      # infra-vps security report: "🔧 Fix" button runs this repo's deploy workflow
      infra-vps.fix: github-workflow
      infra-vps.fix.repo: IavnFGV/EnglishBot-with-agents
      infra-vps.fix.workflow: deploy.yml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    env_file:
      - .env
      - /srv/services/englishbot/infra-runtime.env
      - /srv/services/englishbot/build.env
    environment:
      ENGLISHBOT_DB_PATH: /app/data/englishbot.sqlite3
      ENGLISHBOT_LOG_DIR: /app/logs
      ENGLISHBOT_BACKUP_DIR: /app/backups
      ENGLISHBOT_HEROINE_DIR: /app/heroine
    volumes:
      - /srv/services/englishbot/data:/app/data
      - /srv/services/englishbot/logs:/app/logs
      - /srv/services/englishbot/backups:/app/backups
      - /srv/service-static/englishbot:/app/assets
      - /srv/services/englishbot/heroine:/app/heroine
    expose:
      - "8080"
    networks:
      edge:
        aliases:
          - englishbot-app

  # Optional picture artist. Isolated on purpose: no .env, no database, not on the edge
  # network; it sees only the shared heroine folder and its own Codex login.
  heroine-artist:
    build: infra/heroine-artist
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - /srv/services/englishbot/heroine:/work
      - /srv/services/englishbot/codex-home:/home/node/.codex
    networks:
      - artist

networks:
  artist: {}
  edge:
    external: true
    name: edge
